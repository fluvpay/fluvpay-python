[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluvpay"
version = "1.0.0"
description = "SDK oficial da FluvPay para Python. Pagamentos PIX, saques, transferencias internas e verificacao de webhooks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FluvPay", email = "suporte@fluvpay.com" }]
keywords = ["fluvpay", "pix", "pagamentos", "payments", "gateway", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24,<1",
]

[project.urls]
Homepage = "https://docs.fluvpay.com"
Documentation = "https://docs.fluvpay.com"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fluvpay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
